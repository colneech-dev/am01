# Lays out sdcard.img: a FAT boot partition the Pi firmware reads, and an ext4
# root. Written to the CM4's eMMC with dd once rpiboot has exposed it.

image boot.vfat {
	vfat {
		# The rpi-firmware package stages its files under rpi-firmware/, not
		# at the top of BINARIES_DIR; each is copied in under its basename.
		# overlays/ must come too -- config.txt asks for dtoverlay=miniuart-bt,
		# and a missing .dtbo means no serial console on a headless board.
		files = {
			"bcm2711-rpi-cm4.dtb",
			"Image",
			"cmdline.txt",
			"rpi-firmware/config.txt",
			"rpi-firmware/start4.elf",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/overlays",
			"wpa_supplicant.conf.example",
			# post-image.sh generates three templates and only the
			# WiFi one was listed here, so the two carrying the
			# POOL syntax and the SSH key -- the only documented
			# route back into a headless board after a reflash --
			# never reached the boot partition a user can mount.
			"am01-miner.conf.example",
			"authorized_keys.example",
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
