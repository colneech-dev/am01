; PlatformIO project for the AM01 CYD front panel.
;
; Target: ESP32-2432S028R ("Cheap Yellow Display") -- ESP32-WROOM-32, a
; 320x240 ILI9341 and an XPT2046 resistive touch controller on one PCB.
;
; VERSIONS ARE PINNED, all four of them. This board's software is a minefield
; of "works with the version I had", and an unpinned lib_deps that silently
; moves to a TFT_eSPI with a different User_Setup mechanism turns a working
; panel into a white screen with no code change to blame. Bump them
; deliberately, one at a time.
;
; ---------------------------------------------------------------------------
; THE THING THAT CATCHES EVERYONE: TWO SEPARATE SPI BUSES
; ---------------------------------------------------------------------------
; On this board the display is on HSPI (12/13/14) and the touch controller is
; on VSPI (25/32/33/39). They share no pins.
;
; TFT_eSPI's built-in touch support assumes ONE bus with a second chip select,
; so setting TOUCH_CS here produces a build that works perfectly for the
; display and a touchscreen that never registers a press. That is the single
; most common CYD failure report, and it looks like faulty hardware.
;
; So: TOUCH_CS is deliberately NOT defined, TFT_eSPI drives the display only,
; and XPT2046_Touchscreen drives touch over its own SPIClass instance. Two
; libraries, because there are genuinely two buses.

[env:cyd]
platform  = espressif32@6.6.0
board     = esp32dev
framework = arduino

monitor_speed = 115200
; The link to the FPGA is 115200 (see hdl/uart_bridge.v). Same rate here is a
; convenience, not a requirement -- this is the USB console, used only during
; development; the real link is on JP5 15-18.
upload_speed  = 921600

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    ; Pinned to the upstream git tag, not a registry version, because
    ; PlatformIO's registry carries this library only as an unversioned commit
    ; ("0.0.0-alpha+sha.26b691b2"). A tag is at least a name someone chose;
    ; the registry entry would move under us without one.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

; The probe is a second main(); keep it out of the real firmware's build.
build_src_filter = +<*> -<board_probe.cpp>

build_flags =
    ; cyd_proto.h is shared verbatim with the CM4 daemon in ../host. Both
    ; halves compile the same file, which is the only thing that stops the
    ; protocol drifting into two versions.
    -I$PROJECT_DIR/../host

    -DUSER_SETUP_LOADED=1

    ; ---- panel -----------------------------------------------------------
    ; ILI9341_2_DRIVER, not ILI9341_DRIVER. Later ESP32-2432S028R revisions
    ; ship a panel variant whose init sequence differs; under the plain driver
    ; it comes up with inverted colours or stays white. If this board turns out
    ; to be an early revision, this is the first flag to try switching.
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    ; INVERTED PANEL, confirmed on hardware 2026-09-03 with board_probe. The
    ; second CYD swapped in that day rendered every colour as its inverse:
    ; a TFT_BLACK fill came up WHITE, TFT_GREEN text came up magenta, and the
    ; TFT_YELLOW touch dots came up blue. Yellow's inverse IS blue and green's
    ; IS magenta, so this was not a driver mismatch or a dead panel -- it was
    ; one bit.
    ;
    ; It cost most of an evening because the SYMPTOM was "white screen", and a
    ; white screen reads as "the display never initialised". It was in fact the
    ; UI painting perfectly: C_BG is #100F0B, and inverted that is white.
    ; board_probe answers this in seconds and should have been the FIRST thing
    ; flashed to the new panel, not the last.
    -DTFT_INVERSION_ON=1

    ; ---- display pins (HSPI) ---------------------------------------------
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    ; RST is tied to the ESP32's own reset on this board, not to a GPIO.
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH

    ; ---- fonts -----------------------------------------------------------
    ; Matching what odo-ui uses: a small proportional face for labels and the
    ; 7-segment face for the hashrate readout.
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

    ; ---- SPI rates -------------------------------------------------------
    ; 40MHz, not the 55 or 65 the datasheet allows and most examples use. The
    ; panel sits at the end of a case-length ribbon next to an FPGA drawing
    ; ~12A on its core rail, which is a genuinely hostile place for fast SPI --
    ; and this project has already lost days to a display link that was too
    ; fast for its wiring. There is no throughput reason to push it: a full
    ; repaint at 40MHz is well under the once-a-second update rate.
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; ---------------------------------------------------------------------------
; Board bring-up probe.
;
; Builds and flashes a standalone sketch that fills the screen and reports
; touch coordinates over USB serial -- no link, no protocol, no UI. It exists
; so that "is the panel alive and is touch on the right bus" is answered
; BEFORE any of it is wired to the miner, because answering those two
; questions separately is exactly what was not done with the ILI9341.
;
;   pio run -e probe -t upload && pio device monitor
; ---------------------------------------------------------------------------
[env:probe]
extends = env:cyd
build_src_filter = -<*> +<board_probe.cpp>

; ---------------------------------------------------------------------------
; The OTHER panel revision.
;
; ESP32-2432S028R boards ship with two different ILI9341 variants and they
; need different init sequences. Under the wrong one the panel lights up and
; stays WHITE -- it is backlit, but never receives an init it understands, so
; nothing is ever drawn. Everything else looks healthy: the firmware boots,
; the app runs, the link works.
;
; env:cyd uses ILI9341_2_DRIVER, which is right for the panel board_probe was
; verified on. A SECOND panel was swapped in on 2026-09-03 and came up white,
; which is this exact failure. Same source, one flag different.
;
;   pio run -e cyd_alt -t upload
;
; If this one works, that board is the early revision. Keep both: the two
; panels genuinely differ and the project now has one of each.
; ---------------------------------------------------------------------------
[env:cyd_alt]
extends = env:cyd
build_flags =
    -I$PROJECT_DIR/../host
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
