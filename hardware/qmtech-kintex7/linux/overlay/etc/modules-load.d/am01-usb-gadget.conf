# USB CDC-ACM serial gadget on the mini-USB (J14), giving a console that does
# not touch GPIO14/15 -- those are wired into the FPGA as data bus bits 14/15
# (manual section 2.2.9), so no pin-based UART console is possible.
#
# Creates /dev/ttyGS0 on the board; the machine at the other end of the cable
# sees a USB serial port. serial-getty@ttyGS0 offers the login prompt.
#
# Requires dtoverlay=dwc2,dr_mode=otg in config.txt (dwc2 picks the peripheral
# role automatically when a mini-USB cable is present -- see config.txt).
g_serial
