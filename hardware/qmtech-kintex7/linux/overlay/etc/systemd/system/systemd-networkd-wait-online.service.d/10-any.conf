# Wait for EITHER interface, not all of them, and bound the wait.
#
# Default behaviour waits for every managed link, so an unassociated wlan0
# held boot for the full 120s. The first fix was RequiredForOnline=no on
# wlan0, which stopped the stall but went too far: a link marked not-required
# is ignored entirely, so the board would not wait for WiFi even when WiFi is
# the only network it has.
#
# --any returns as soon as one link is online, so:
#   ethernet plugged in  -> proceeds in a second or two
#   WiFi only            -> proceeds the moment wlan0 associates
#   neither              -> gives up after 60s and boots anyway
#
# 60s rather than the 120s default: long enough for a WPA handshake and DHCP
# on a slow router, short enough not to feel hung. odo-miner retries the pool
# every 30s indefinitely, so a late-arriving network is picked up regardless
# -- this timeout only affects how long boot itself pauses.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=60
