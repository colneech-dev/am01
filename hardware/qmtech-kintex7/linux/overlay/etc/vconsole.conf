# Virtual console keyboard layout, read by systemd-vconsole-setup at boot.
#
# "uk" is kbd's name for the GB layout (data/keymaps/i386/qwerty/uk.map.gz);
# there is no "gb" map, so KEYMAP=gb would silently fall back to us.
#
# This file is shipped explicitly rather than relying on systemd's
# compiled-in -Ddefault-keymap, because the compiled default only applies
# when KEYMAP is unset -- being explicit here means the layout survives a
# systemd rebuild that forgets the meson option.
KEYMAP=uk
FONT=lat1-16
